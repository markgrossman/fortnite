name: Update stats

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment: Prod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-stats.mjs
        env:
          FORTNITE_API_KEY: ${{ secrets.FORTNITE_API_KEY }}
      - name: Commit changes
        run: |
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update stats"
          git push
